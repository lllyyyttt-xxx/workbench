<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语工作台</title>
<style>
  .back-home {
    font-size: 13px; color: #00897b; text-decoration: none; padding: 4px 10px;
    border: 1px solid #cfe8e3; border-radius: 6px; margin-right: 14px; vertical-align: middle;
  }
  .back-home:hover { background: #e0f2f1; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f5f5; }
header { background: #fff; padding: 16px 20px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 18px; font-weight: 600; }
.quote-section { max-width: 1200px; margin: 20px auto 0; padding: 20px; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; }
.quote-section h3 { font-size: 13px; color: #00897b; margin-bottom: 10px; text-transform: uppercase; }
.quote-section blockquote { font-size: 17px; line-height: 1.6; color: #333; border-left: 4px solid #00897b; padding-left: 14px; margin: 0 0 6px; }
.quote-zh { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e8e8e8; font-size: 14px; line-height: 1.7; color: #666; }
.container { display: flex; max-width: 1200px; margin: 20px auto; padding: 0 20px; gap: 20px; }
.sidebar { width: 110px; flex-shrink: 0; }
.sidebar button { width: 100%; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
.sidebar button.active { background: #e0f2f1; border-color: #00897b; color: #00897b; }
.sidebar button:hover:not(.active) { background: #f0f0f0; }
.main { flex: 1; display: flex; gap: 16px; min-width: 0; }
.list-panel { width: 320px; flex-shrink: 0; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; display: flex; flex-direction: column; max-height: 760px; }
.search-box { padding: 12px; border-bottom: 1px solid #e0e0e0; }
.search-box input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.search-box input:focus { outline: none; border-color: #00897b; }
.daily-section { padding: 10px 12px; border-bottom: 1px solid #e0e0e0; background: #fafafa; }
.daily-section h3 { font-size: 11px; color: #888; text-transform: uppercase; margin-bottom: 6px; }
.word-list { list-style: none; overflow-y: auto; flex: 1; }
.word-list li { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.word-list li:hover { background: #f5f5f5; }
.word-list li.active { background: #e0f2f1; }
.word-list .word { font-weight: 600; flex: 1; }
.word-list .pos { color: #888; font-size: 12px; }
.word-list .level { font-size: 11px; color: #fff; background: #b0bec5; border-radius: 3px; padding: 1px 5px; flex-shrink: 0; }
.word-list .level.cet6 { background: #ff8f00; }
.word-list .meaning { color: #555; font-size: 12px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.level-tag { display: inline-block; font-size: 12px; font-weight: 600; color: #00897b; background: #e0f2f1; border-radius: 4px; padding: 2px 8px; margin-right: 8px; vertical-align: middle; }
.level-tag.cet6 { color: #e65100; background: #fff3e0; }
.detail-panel { flex: 1; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; padding: 24px; overflow-y: auto; max-height: 760px; }
.empty { color: #888; text-align: center; padding: 60px 20px; }
.head-row { display: flex; align-items: flex-start; gap: 12px; }
.headword { font-size: 30px; font-weight: 700; margin-bottom: 6px; flex: 1; }
.nb-toggle { padding: 6px 14px; border: 1px solid #00897b; background: #fff; color: #00897b; border-radius: 16px; cursor: pointer; font-size: 13px; white-space: nowrap; }
.nb-toggle.remove { border-color: #c62828; color: #c62828; }
.phonetic { color: #666; font-size: 16px; margin-bottom: 10px; }
.pos-badge { display: inline-block; background: #e0f2f1; color: #00897b; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 8px; }
.meaning { font-size: 16px; line-height: 1.6; color: #333; }
.section { margin-top: 24px; }
.section h3 { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 10px; }
.synonyms { display: flex; flex-wrap: wrap; gap: 8px; }
.synonym-btn { padding: 6px 14px; border: 1px solid #ddd; background: #fff; border-radius: 20px; cursor: pointer; font-size: 13px; }
.synonym-btn:hover { border-color: #00897b; color: #00897b; }
.examples { list-style: none; }
.examples li { padding: 12px; background: #f9f9f9; border-radius: 6px; margin-bottom: 8px; }
.examples .source { font-size: 11px; color: #00897b; margin-bottom: 4px; font-weight: 500; }
.examples .text { font-size: 14px; line-height: 1.5; color: #333; }
.hint { color: #888; font-size: 14px; line-height: 1.6; }
mark { background: #fff176; padding: 1px 2px; border-radius: 2px; }
.mode-tabs { display: flex; gap: 6px; margin-left: auto; }
.mode-tabs .mode-btn { padding: 6px 14px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer; font-size: 14px; }
.mode-tabs .mode-btn.active { background: #00897b; border-color: #00897b; color: #fff; }
.mode-tabs .count { font-size: 12px; opacity: .85; margin-left: 4px; }
.nb-head { padding: 12px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nb-head span { font-size: 13px; color: #555; }
.nb-head button { padding: 4px 10px; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; color: #555; }
.nb-head button#nbClear { color: #c62828; }
.nb-actions { display: flex; gap: 6px; flex-shrink: 0; }
.store-label { font-size: 11px; color: #999; margin-left: 8px; cursor: help; }
.nb-filters { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #e0e0e0; background: #fafafa; }
.nb-filters button { flex: 1; padding: 5px 0; border: 1px solid #ddd; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
.nb-filters button.active { background: #e0f2f1; border-color: #00897b; color: #00897b; }
.nb-filters button[data-nb="stubborn"].active { background: #ffebee; border-color: #c62828; color: #c62828; }
.word-list .bad-badge { font-size: 11px; color: #c62828; background: #ffebee; border-radius: 3px; padding: 1px 5px; flex-shrink: 0; }
.word-list .due-badge { font-size: 11px; color: #00897b; background: #e0f2f1; border-radius: 3px; padding: 1px 5px; flex-shrink: 0; }

/* 读文章 */
.read-panel { flex: 1; min-width: 0; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; max-height: 760px; }
.read-head { padding: 14px 24px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.read-title { font-size: 16px; font-weight: 600; }
.read-sub { font-size: 12px; color: #888; margin-top: 4px; }
.read-body { padding: 20px 28px; overflow-y: auto; line-height: 2; font-size: 16px; color: #333; }
.read-body p { margin-bottom: 14px; }
.read-body .hl { cursor: pointer; border-bottom: 1px dashed #ffb74d; padding-bottom: 1px; }
.read-body .hl:hover { background: #fff8e1; }
.read-body .hl.known { border-bottom-color: #90caf9; color: #1565c0; }
.read-body .hl.unknown { background: #ffebee; border-bottom-color: #ef9a9a; color: #c62828; }
.word-card {
  position: fixed; z-index: 50; width: 280px; background: #fff; border: 1px solid #ddd;
  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.16); padding: 14px 16px; display: none;
}
.word-card.show { display: block; animation: badgePop .18s ease both; }
.word-card .wc-word { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.word-card .wc-phonetic { color: #888; font-size: 13px; margin-top: 2px; }
.word-card .wc-meaning { font-size: 14px; margin-top: 8px; line-height: 1.5; }
.word-card .wc-exam { font-size: 12px; color: #888; margin-top: 6px; }
.word-card .wc-actions { margin-top: 10px; display: flex; gap: 8px; }
.word-card .wc-actions button { flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid #00897b; background: #fff; color: #00897b; cursor: pointer; font-size: 13px; }
.word-card .wc-actions button.remove { border-color: #c62828; color: #c62828; }
.word-card .wc-close { position: absolute; top: 8px; right: 10px; border: none; background: none; font-size: 16px; color: #aaa; cursor: pointer; }
.study-panel { flex: 1; min-width: 0; background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; gap: 24px; }
.card { width: min(560px, 100%); height: 340px; perspective: 1000px; cursor: pointer; }
.card-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; padding: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.card-front { background: #f0f7f6; border: 1px solid #d5e8e5; }
.card-back { background: #fff; border: 1px solid #e0e0e0; transform: rotateY(180deg); }
.card-word { font-size: 40px; font-weight: 700; }
.card-phonetic { color: #666; font-size: 18px; margin-top: 10px; }
.card-pos { color: #00897b; font-weight: 600; margin-bottom: 10px; }
.card-meaning { font-size: 20px; line-height: 1.6; text-align: center; }
.card-example { margin-top: 16px; color: #555; font-size: 14px; max-width: 460px; text-align: center; line-height: 1.5; }
.card-src { color: #999; font-size: 11px; margin-top: 6px; }
.card-tip { color: #999; font-size: 12px; margin-top: auto; }
.study-status { font-size: 13px; color: #777; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.study-status b { color: #333; }
.study-level { font-size: 12px; font-weight: 600; color: #00897b; background: #e0f2f1; border-radius: 4px; padding: 2px 8px; }
.study-level.cet6 { color: #e65100; background: #fff3e0; }
.study-controls { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
.study-progress { color: #888; font-size: 14px; }
.study-controls button { padding: 10px 22px; border-radius: 6px; cursor: pointer; font-size: 15px; border: 1px solid #ddd; background: #fff; }
.study-controls .btn-primary { background: #00897b; border-color: #00897b; color: #fff; }
.study-controls .btn-danger { color: #c62828; border-color: #e0a0a0; }
.study-controls button:disabled { color: #bbb; border-color: #eee; background: #fafafa; cursor: not-allowed; }

/* 答对：上浮 + 绿框 + 对勾标记 */
@keyframes knownLift {
  0% { transform: translateY(0) scale(1); }
  45% { transform: translateY(-10px) scale(1.02); }
  100% { transform: translateY(-4px) scale(1); }
}
.card.answer-known { animation: knownLift .5s cubic-bezier(.34,1.2,.64,1) both; }
.card.answer-known .card-face { border-color: #4caf50; }
.card.answer-known .card-back { box-shadow: 0 10px 24px rgba(76,175,80,.22); }
.card.answer-known::after {
  content: "认识 ✓"; position: absolute; top: 14px; right: 16px; z-index: 5;
  font-size: 13px; font-weight: 700; color: #2e7d32; background: #e8f5e9;
  border: 1px solid #a5d6a7; border-radius: 14px; padding: 3px 12px;
  animation: badgePop .35s ease both;
}
/* 答错：左右抖动 + 红框 + 叉号标记 */
@keyframes missShake {
  0%, 100% { transform: translateX(0); }
  12% { transform: translateX(-10px) rotate(-1deg); }
  26% { transform: translateX(9px) rotate(1deg); }
  40% { transform: translateX(-7px) rotate(-.8deg); }
  54% { transform: translateX(5px) rotate(.6deg); }
  70% { transform: translateX(-3px); }
  85% { transform: translateX(2px); }
}
.card.answer-miss { animation: missShake .55s ease both; }
.card.answer-miss .card-face { border-color: #ef5350; }
.card.answer-miss .card-back { box-shadow: 0 10px 24px rgba(239,83,80,.22); }
.card.answer-miss::after {
  content: "不认识 ✗"; position: absolute; top: 14px; right: 16px; z-index: 5;
  font-size: 13px; font-weight: 700; color: #c62828; background: #ffebee;
  border: 1px solid #ef9a9a; border-radius: 14px; padding: 3px 12px;
  animation: badgePop .35s ease both;
}
@keyframes badgePop {
  0% { transform: scale(.6); opacity: 0; }
  70% { transform: scale(1.08); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
/* 下一张卡片淡入 */
@keyframes cardIn {
  0% { transform: translateY(14px) scale(.98); opacity: 0; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.card.card-enter { animation: cardIn .3s ease both; }
/* 按钮反馈 */
@keyframes btnOk {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,137,123,.45); }
  50% { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(0,137,123,0); }
  100% { transform: scale(1); }
}
@keyframes btnBad {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(198,40,40,.45); }
  50% { transform: scale(1.06); box-shadow: 0 0 0 8px rgba(198,40,40,0); }
  100% { transform: scale(1); }
}
.study-controls button.flash-ok { animation: btnOk .45s ease; }
.study-controls button.flash-bad { animation: btnBad .45s ease; }
.study-controls button:disabled { animation: none; }

@media (max-width: 768px) {
  .container { flex-direction: column; }
  .sidebar { width: 100%; display: flex; gap: 8px; }
  .sidebar button { flex: 1; margin-bottom: 0; }
  .main { flex-direction: column; }
  .list-panel { width: 100%; max-height: 300px; }
  .detail-panel, .study-panel { max-height: none; }
}
  /* ---------- 液态玻璃统一主题（2026-10-27） ----------
   * 这一页原来是最早做的白盒子风格：纯白卡片 + 灰色背景 + 灰色边框，
   * 点进来跟首页那套玻璃完全不是一回事。下面只覆盖"材质"，布局、尺寸、
   * 主色（青绿 #00897b）全部不动。
   */
  header {
    background: var(--wb-glass-bg-soft);
    border-bottom: 1px solid var(--wb-glass-line-soft);
    backdrop-filter: var(--wb-glass-blur);
    -webkit-backdrop-filter: var(--wb-glass-blur);
  }
  .quote-section,
  .list-panel,
  .detail-panel,
  .read-panel,
  .study-panel {
    background: var(--wb-glass-bg);
    border: 1px solid var(--wb-glass-line);
    backdrop-filter: var(--wb-glass-blur);
    -webkit-backdrop-filter: var(--wb-glass-blur);
    box-shadow: var(--wb-glass-shadow);
    border-radius: 18px;
  }
  .list-panel, .detail-panel, .read-panel, .study-panel { border-radius: 18px; }
  .sidebar button,
  .synonym-btn,
  .nb-toggle,
  .mode-tabs .mode-btn,
  .nb-filters button,
  .nb-head button,
  .study-controls button {
    background: var(--wb-glass-bg-soft);
    border-color: var(--wb-glass-line-soft);
    backdrop-filter: blur(14px) saturate(150%);
    -webkit-backdrop-filter: blur(14px) saturate(150%);
    box-shadow: var(--wb-glass-shadow-sm);
    border-radius: 10px;
  }
  .sidebar button { border-radius: 12px; }
  .sidebar button.active,
  .mode-tabs .mode-btn.active,
  .nb-filters button.active {
    background: rgba(0,137,123,.16);
    border-color: rgba(0,137,123,.45);
  }
  .search-box input {
    background: rgba(255,255,255,.72);
    border-color: var(--wb-glass-line-soft);
    border-radius: 10px;
  }
  .card-front,
  .card-back {
    background: var(--wb-glass-bg-strong);
    border: 1px solid var(--wb-glass-line);
    backdrop-filter: var(--wb-glass-blur);
    -webkit-backdrop-filter: var(--wb-glass-blur);
    box-shadow: var(--wb-glass-shadow);
  }
  /* 内部这些浅底块别再做一层实色，让玻璃底透上来 */
  .daily-section, .nb-filters, .search-box, .examples li, .read-body .hl, .word-card {
    background: rgba(255,255,255,.42);
  }
  .word-list li:hover { background: rgba(255,255,255,.45); }
  .word-list li.active { background: rgba(0,137,123,.12); }
</style>

<body data-rail-current="english" class="has-wrail">
<header>
  <h1>英语工作台</h1>
  <nav class="mode-tabs">
    <button class="mode-btn active" data-mode="lookup">查词</button>
    <button class="mode-btn" data-mode="study">背词</button>
    <button class="mode-btn" data-mode="notebook">单词本<span class="count" id="nbCount">0</span></button>
    <button class="mode-btn" data-mode="read">读文章</button>
  </nav>
</header>
<div class="quote-section" id="quoteSection">
  <h3>每日名言</h3>
  <blockquote id="quoteText"></blockquote>
  <p class="quote-zh" id="quoteZh"></p>
</div>
<div class="container">
  <nav class="sidebar">
    <button class="active" data-level="cet4">CET-4</button>
    <button data-level="cet6">CET-6</button>
  </nav>
  <div class="main">
    <div class="list-panel" id="listPanel">
      <div class="search-box">
        <input id="search" type="text" placeholder="输入单词搜索...">
      </div>
      <div class="daily-section" id="dailySection">
        <h3>每日推荐</h3>
        <ul class="word-list" id="dailyList"></ul>
      </div>
      <ul class="word-list" id="wordList"></ul>
    </div>
    <div class="list-panel" id="notebookPanel" style="display:none;">
      <div class="nb-head">
        <span id="nbSummary">单词本</span>
        <span id="storeLabel" class="store-label"></span>
        <span class="nb-actions">
          <button id="nbExport" title="把单词本和复习进度导出成文件">导出</button>
          <button id="nbImport" title="从备份文件恢复">导入</button>
          <button id="nbClear">清空</button>
        </span>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
      </div>
      <div class="nb-filters">
        <button class="active" data-nb="all">全部</button>
        <button data-nb="cet4">四级</button>
        <button data-nb="cet6">六级</button>
        <button data-nb="stubborn" title="反复答错的词">顽固词</button>
      </div>
      <ul class="word-list" id="nbList"></ul>
    </div>
    <div class="list-panel" id="readPanel" style="display:none;">
      <div class="nb-head">
        <span id="readSummary">选择一篇原文</span>
      </div>
      <ul class="word-list" id="paperList"></ul>
    </div>
    <div class="read-panel" id="readView" style="display:none;">
      <div class="read-head">
        <div>
          <div class="read-title" id="readTitle">读文章</div>
          <div class="read-sub" id="readSub"></div>
        </div>
        <button class="nb-toggle" id="readCollect">收藏本篇生词</button>
      </div>
      <div class="read-body" id="readBody">
        <p class="empty">从左侧选一篇原文，原文里出现的四六级单词都能点亮，点一下就能看释义。</p>
      </div>
    </div>
    <div class="detail-panel" id="detail">
      <p class="empty">从左侧选一个单词，或直接输入查词。</p>
    </div>
    <div class="study-panel" id="studyPanel" style="display:none;">
      <div class="study-status" id="studyStatus"></div>
      <div class="card" id="card">
        <div class="card-inner">
          <div class="card-face card-front">
            <div class="card-word" id="cardWord"></div>
            <div class="card-phonetic" id="cardPhonetic"></div>
            <div class="card-tip">点击卡片查看释义</div>
          </div>
          <div class="card-face card-back">
            <div class="card-word" id="cardWordBack"></div>
            <div class="card-pos" id="cardPos"></div>
            <div class="card-meaning" id="cardMeaning"></div>
            <div class="card-example" id="cardExample"></div>
            <div class="card-src" id="cardSrc"></div>
          </div>
        </div>
      </div>
      <div class="study-controls">
        <span class="study-progress" id="studyProgress"></span>
        <button id="btnPrev">上一个</button>
        <button id="btnUnknown" class="btn-danger">不认识</button>
        <button id="btnKnown" class="btn-primary">认识</button>
        <button id="btnAgain" class="btn-primary" style="display:none;">再来一轮</button>
        <button id="btnExit">结束</button>
      </div>
    </div>
  </div>
</div>
<div class="word-card" id="wordCard">
  <button class="wc-close" id="wcClose">×</button>
  <div class="wc-word" id="wcWord"></div>
  <div class="wc-phonetic" id="wcPhonetic"></div>

const SENTS = [["A Morning in the Library", "", "Walking into the library early in the morning is one of the quiet pleasures of campus life."], ["A Morning in the Library", "", "The doors open at seven, and a few students are always waiting outside with coffee in one hand and a heavy bag in the other."], ["A Morning in the Library", "", "They come for different reasons, but they share the same simple goal: a place where nothing interrupts them."], ["A Morning in the Library", "", "Inside, the air is cool and the lights are soft."], ["A Morning in the Library", "", "Rows of desks stretch toward the windows, and each desk has a small lamp that hums when you switch it on."], ["A Morning in the Library", "", "There is no music here, only the sound of pages turning and chairs moving."], ["A Morning in the Library", "", "Most people keep their voices low, and that unspoken rule makes the room feel calm."], ["A Morning in the Library", "", "If you look closely, you can see how different people work."], ["A Morning in the Library", "", "One student reads a thick book and writes notes in the margin."], ["A Morning in the Library", "", "Another types quickly, stops, and stares at the screen as if the answer might appear by itself."], ["A Morning in the Library", "", "A third has fallen asleep on an open book, which is a familiar scene in every library in the world."], ["A Morning in the Library", "", "By nine the room is almost full."], ["A Morning in the Library", "", "The morning light climbs across the floor, and the first class of the day begins somewhere upstairs."], ["A Morning in the Library", "", "Nobody notices the time pass, because a good library does not simply store books."], ["A Morning in the Library", "", "It offers a space where attention becomes possible again."], ["Why Recycling Matters", "", "Most people agree that recycling is a good idea, yet few of us think about what actually happens after we drop a bottle into the green box."], ["Why Recycling Matters", "", "The process begins with collection, continues with sorting, and ends with materials that can be used again."], ["Why Recycling Matters", "", "Each step depends on ordinary people making a small decision at home."], ["Why Recycling Matters", "", "The environment benefits in clear ways."], ["Why Recycling Matters", "", "Making new aluminium from old cans requires far less energy than producing it from raw material."], ["Why Recycling Matters", "", "Paper can be turned into new sheets several times before the fibres become too short."], ["Why Recycling Matters", "", "Glass can be melted and shaped again and again without losing quality."], ["Why Recycling Matters", "", "These facts explain why a simple habit can have a significant impact."], ["Why Recycling Matters", "", "Recycling is not a perfect solution, however."], ["Why Recycling Matters", "", "It cannot replace the need to consume less in the first place."], ["Why Recycling Matters", "", "A product that is never made creates no waste at all, and this is the most efficient choice available to us."], ["Why Recycling Matters", "", "When we buy carefully and repair what we own, we reduce the demand that drives production."], ["Why Recycling Matters", "", "The practical lesson is not to feel guilty about every plastic bag."], ["Why Recycling Matters", "", "It is to build habits that are easy to keep."], ["Why Recycling Matters", "", "Wash your containers, learn what your local system accepts, and refuse unnecessary packaging when you can."], ["Why Recycling Matters", "", "Small actions repeated by many people eventually change what a society considers normal."], ["The Phone in Your Pocket", "", "Thirty years ago, a telephone was a heavy object attached to a wall."], ["The Phone in Your Pocket", "", "Today it is a thin piece of glass that we carry everywhere, and it does far more than make calls."], ["The Phone in Your Pocket", "", "It is a camera, a map, a library, a bank and a cinema."], ["The Phone in Your Pocket", "", "The transformation happened so quickly that we rarely stop to examine its effects."], ["The Phone in Your Pocket", "", "The obvious benefit is convenience."], ["The Phone in Your Pocket", "", "We can confirm a meeting, transfer money or find a route in seconds."], ["The Phone in Your Pocket", "", "Small businesses can reach customers without expensive advertising."], ["The Phone in Your Pocket", "", "Students can watch a lecture twice and pause whenever a concept becomes difficult."], ["The Phone in Your Pocket", "", "These advantages are genuine and should not be dismissed."], ["The Phone in Your Pocket", "", "Yet the same device that connects us can also divide our attention."], ["The Phone in Your Pocket", "", "A notification arrives, and the mind leaves the room for a moment."], ["The Phone in Your Pocket", "", "Research suggests that switching tasks repeatedly makes us slower rather than faster, because the brain must rebuild its focus each time."], ["The Phone in Your Pocket", "", "What feels like efficiency is often a sequence of small interruptions."], ["The Phone in Your Pocket", "", "The solution is not to abandon the technology but to define the relationship."], ["The Phone in Your Pocket", "", "Decide when the phone stays in another room."], ["The Phone in Your Pocket", "", "Turn off the alerts that add nothing."], ["The Phone in Your Pocket", "", "Use the device as a tool rather than a constant companion, and it will serve you instead of the other way around."], ["Running Through Winter", "", "When the temperature drops, the number of runners on the street falls with it."], ["Running Through Winter", "", "Winter offers a convenient excuse, and many people accept it without much thought."], ["Running Through Winter", "", "Yet the season is actually a good time to build strength, because the body adapts to cold air in ways that benefit the whole year."], ["Running Through Winter", "", "The first rule is to warm up indoors."], ["Running Through Winter", "", "Cold muscles are easily injured, so a few minutes of movement before you leave the house makes a real difference."], ["Running Through Winter", "", "Wear layers that you can remove as your body produces heat, and keep your hands covered."], ["Running Through Winter", "", "A thin hat and gloves cost very little and protect you from discomfort."], ["Running Through Winter", "", "The second rule is to slow down."], ["Running Through Winter", "", "Cold air feels heavier in the lungs, and your normal pace may seem harder than usual."], ["Running Through Winter", "", "This is not a sign of weakness; it is simply how the body responds."], ["Running Through Winter", "", "Reduce your speed, shorten the distance if necessary, and pay attention to how you feel rather than to a number on a watch."], ["Running Through Winter", "", "Finally, choose the right moment."], ["Running Through Winter", "", "Running in the early morning darkness is not always safe, especially on icy roads."], ["Running Through Winter", "", "A lunchtime run or an afternoon session gives you better light and warmer air."], ["Running Through Winter", "", "Winter does not have to end your training."], ["Running Through Winter", "", "With a little planning, it can become the season when your habits become stronger."], ["A Weekend in the Mountains", "", "We left the city on Friday evening with too much luggage and very little plan."], ["A Weekend in the Mountains", "", "The bus was slow, the road was narrow, and by the time we reached the village it was completely dark."], ["A Weekend in the Mountains", "", "There was no street light, only the sound of water moving somewhere below us."], ["A Weekend in the Mountains", "", "For a moment I wondered whether the trip was a mistake."], ["A Weekend in the Mountains", "", "The morning answered that question."], ["A Weekend in the Mountains", "", "The mountains appeared behind a layer of mist, and the air smelled of wet earth and wood smoke."], ["A Weekend in the Mountains", "", "We walked a path that climbed steadily through small fields, passing an old man who carried a basket and smiled without speaking."], ["A Weekend in the Mountains", "", "Two hours later we reached a ridge where the whole valley was visible below us."], ["A Weekend in the Mountains", "", "Travel of this kind is not comfortable, and that is part of its value."], ["A Weekend in the Mountains", "", "When everything is familiar, we stop noticing."], ["A Weekend in the Mountains", "", "A different landscape forces the mind to pay attention again, and small problems become stories rather than disasters."], ["A Weekend in the Mountains", "", "We ate simple food that tasted better than anything I had ordered in the city for months."], ["A Weekend in the Mountains", "", "On Sunday we took the same bus home, tired and quiet."], ["A Weekend in the Mountains", "", "Nothing extraordinary had happened, and yet something had changed."], ["A Weekend in the Mountains", "", "The weekend did not give us a complete rest, but it gave us distance from our routine."], ["A Weekend in the Mountains", "", "Sometimes that is exactly what a person needs in order to return to work with a clearer head."], ["Learning to Say No", "", "Many of us were taught that a good person is always available."], ["Learning to Say No", "", "Say yes to the request, accept the invitation, help with the project."], ["Learning to Say No", "", "This attitude seems generous, and in small doses it is."], ["Learning to Say No", "", "The problem appears when the pattern becomes automatic and our own priorities disappear from the schedule."], ["Learning to Say No", "", "The cost is not obvious at first."], ["Learning to Say No", "", "You agree to one more task, and then another, and soon every hour is assigned to someone else."], ["Learning to Say No", "", "Sleep becomes shorter, concentration becomes weaker, and the work you care about is pushed to the late evening."], ["Learning to Say No", "", "Nobody forced this situation."], ["Learning to Say No", "", "It was created by a series of polite answers."], ["Learning to Say No", "", "Refusing is difficult because we imagine the reaction."], ["Learning to Say No", "", "We expect disappointment, or a judgement about our character."], ["Learning to Say No", "", "In practice, most people accept a clear answer far more easily than they accept a vague promise that is never fulfilled."], ["Learning to Say No", "", "Being honest early is kinder than being unreliable later."], ["Learning to Say No", "", "A simple method helps."], ["Learning to Say No", "", "Ask for time before you reply, then decide whether the request fits your goals."], ["Learning to Say No", "", "If it does not, say so briefly and without a long explanation."], ["Learning to Say No", "", "You do not owe anyone a detailed defence of your schedule."], ["Learning to Say No", "", "Protecting your attention is not selfish; it is the condition that allows you to do good work for the people who matter most."]];

/* ---------- 存储 ----------
 * 页面里所有进度都只经过 Store 读写。
 * 放进工作台后，数据统一由工作台的共享存储层管理，命名空间是 english，
 * 这样英语模块的键名会自动加前缀，跟别的模块的键不会撞车。
 * 直接单独打开这个文件时，退回到页面自带的实现，数据照样能存。
 */
const NB_KEY = 'vocab_notebook';
const MODULE_NS = 'english';

function makeModuleStore() {
  const wb = (typeof window !== 'undefined') ? window.WorkbenchStore : null;
  if (wb && typeof wb.namespace === 'function') {
    const ns = wb.namespace(MODULE_NS);
    return {
      name: wb.backend || 'browser',
      get: k => { const v = ns.get(k, null); return (v === null || v === undefined) ? null : JSON.stringify(v); },
      set: (k, v) => ns.set(k, JSON.parse(v)),
      remove: k => ns.remove(k),
      keys: () => ns.keys(),
      available: () => true,
      shared: true,
      ns,
    };
  }
  return null;
}

const BrowserStore = {
  name: 'browser',
  get(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; } catch (e) { return false; }
  },
  keys() {
    try { return Object.keys(localStorage); } catch (e) { return []; }
  },
  available() { return true; },
};

// 外壳注入的存储优先
const Store = (function () {
  const shared = makeModuleStore();
  if (shared) return shared;
  const injected = (typeof window !== 'undefined') ? window.__WORKBENCH_STORE__ : null;
  if (injected && typeof injected.get === 'function' && typeof injected.set === 'function') {
    return {
      name: injected.name || 'native',
      get: k => { try { return injected.get(k); } catch (e) { return null; } },
      set: (k, v) => { try { injected.set(k, v); return true; } catch (e) { return false; } },
      remove: k => { try { if (injected.remove) injected.remove(k); return true; } catch (e) { return false; } },
      keys: () => { try { return injected.keys ? injected.keys() : []; } catch (e) { return []; } },
      available: () => { try { return injected.available ? !!injected.available() : true; } catch (e) { return true; } },
    };
  }
  return BrowserStore;
})();

function storageWorks() { return Store.available(); }

/* 加入工作台前存的是不带前缀的老键名，第一次在新位置打开时搬过来 */
/* 旧数据只读，绝不写入：迁移后一切写入都走 Store */
const LegacyStore = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
};

function migrateLegacyKeys() {
  if (!Store.shared) return;
  const legacy = [NB_KEY, 'vocab_srs', 'vocab_stats', 'vocab_mastered_cet4', 'vocab_mastered_cet6'];
  legacy.forEach(k => {
    if (Store.get(k) !== null) return;
    let old = null;
    try { old = LegacyStore.get(k); } catch (e) { return; }
    if (old === null) return;
    try { Store.set(k, old); } catch (e) {}
  });
}

function loadJSON(key, fallback) {
  try {
    const raw = Store.get(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { return Store.set(key, JSON.stringify(value)); } catch (e) { return false; }
}

function loadNotebook() {
  const rows = loadJSON(NB_KEY, []);
  return Array.isArray(rows) ? rows.filter(r => r && r.w) : [];
}
function saveNotebook(rows) { saveJSON(NB_KEY, rows); }
function nbHas(word) { return loadNotebook().some(r => r.w === word); }
function nbAdd(word) {
  const rows = loadNotebook();
  if (rows.some(r => r.w === word)) return false;
  const rec = WORD_MAP.get(word.toLowerCase());
  rows.unshift({ w: word, level: rec ? rec.level : currentLevel, t: Date.now() });
  saveNotebook(rows);
  return true;
}
function nbRemove(word) { saveNotebook(loadNotebook().filter(r => r.w !== word)); }

/* ---------- 复习进度（间隔重复） ---------- */
const SRS_KEY = 'vocab_srs';
const STATS_KEY = 'vocab_stats';
const DAY = 86400000;
// 答对一次推进一档：新词/答错后先在 0 档，答对过 1 次隔 1 天再来，之后 2、4、7、15、30、60、120 天
const SRS_INTERVALS = [0, 1, 2, 4, 7, 15, 30, 60, 120];

function loadSrs() {
  const v = loadJSON(SRS_KEY, {});
  return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
}
function saveSrs(srs) { saveJSON(SRS_KEY, srs); }
function srsOf(word) { return loadSrs()[word] || null; }

function srsGrade(word, known) {
  const srs = loadSrs();
  const rec = srs[word] || { s: 0, ok: 0, bad: 0, d: 0, l: 0 };
  if (known) {
    rec.s = Math.min((rec.s || 0) + 1, SRS_INTERVALS.length - 1);
    rec.ok = (rec.ok || 0) + 1;
  } else {
    rec.s = 0;
    rec.bad = (rec.bad || 0) + 1;
  }
  rec.l = Date.now();
  rec.d = Date.now() + SRS_INTERVALS[rec.s] * DAY;
  srs[word] = rec;
  saveSrs(srs);
  return rec;
}

function dueWords(level) {
  const now = Date.now();
  const srs = loadSrs();
  return Object.keys(srs)
    .filter(w => {
      const rec = srs[w];
      const info = WORD_MAP.get(w.toLowerCase());
      return info && info.level === level && rec && rec.d && rec.d <= now;
    })
    .sort((a, b) => (srs[a].d || 0) - (srs[b].d || 0));
}

function srsMasteredCount(level) {
  const srs = loadSrs();
  return Object.keys(srs).filter(w => {
    const info = WORD_MAP.get(w.toLowerCase());
    return info && info.level === level && srs[w] && srs[w].s >= 4;
  }).length;
}

function todayKey() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function loadStats() {
  const v = loadJSON(STATS_KEY, {});
  return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
}
function saveStats(stats) { saveJSON(STATS_KEY, stats); }

function recordAnswer(known) {
  const stats = loadStats();
  const key = todayKey();
  const day = stats[key] || { n: 0, ok: 0 };
  day.n += 1;
  if (known) day.ok += 1;
  stats[key] = day;
  saveStats(stats);
}

function todayStats() {
  const stats = loadStats();
  return stats[todayKey()] || { n: 0, ok: 0 };
}

function streakDays() {
  const stats = loadStats();
  let count = 0;
  const d = new Date();
  for (;;) {
    const p = n => String(n).padStart(2, '0');
    const key = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    const day = stats[key];
    if (day && day.n > 0) { count += 1; d.setDate(d.getDate() - 1); }
    else if (count === 0 && key === todayKey()) { d.setDate(d.getDate() - 1); }
    else break;
  }
  return count;
}

/* 老版本只存了“已掌握”名单，首次使用时迁移成复习记录，避免进度丢失 */
function migrateOldProgress() {
  if (Store.get(SRS_KEY)) return;
  const srs = {};
  ['cet4', 'cet6'].forEach(lv => {
    const old = loadJSON('vocab_mastered_' + lv, []);
    if (Array.isArray(old)) {
      old.forEach(w => {
        srs[w] = { s: 3, ok: 1, bad: 0, l: Date.now(), d: Date.now() + SRS_INTERVALS[3] * DAY };
      });
    }
  });
  if (Object.keys(srs).length) saveSrs(srs);
}

/* ---------- 原文索引 ---------- */
function formsFor(word) {
  const w = String(word).toLowerCase();
  if (w.length <= 2) return [w];
  const forms = new Set([w, w + 's', w + 'es', w + 'ed', w + 'd', w + 'ing', w + 'ly', w + 'er', w + 'est']);
  if (w.endsWith('e')) { forms.add(w.slice(0, -1) + 'ing'); forms.add(w.slice(0, -1) + 'ed'); }
  if (w.endsWith('y')) { forms.add(w.slice(0, -1) + 'ies'); forms.add(w.slice(0, -1) + 'ied'); }
  return [...forms];
}

function sentencesFor(word) {
  const key = String(word).toLowerCase();
  const rec = SENT_INDEX[key];
  if (!rec) return { hits: [], cross: false, root: '' };
  return {
    hits: (rec.i || []).map(i => SENTS[i]).filter(Boolean),
    cross: !!rec.x,
    root: rec.r || '',
  };
}
function rootHint(word) {
  const rec = SENT_INDEX[String(word).toLowerCase()];
  return (rec && rec.r) || ROOT_HINTS[String(word).toLowerCase()] || '';
}

/* ---------- 原文用法 ---------- */
function examInfo(word) {
  const rec = EXAM[String(word).toLowerCase()];
  if (!rec) return null;
  return {
    n: rec.n || 0,
    forms: rec.f || [],
    papers: (rec.p || []).map(i => PAPERS[i] && PAPERS[i].l).filter(Boolean),
  };
}

function examBlock(word) {
  const info = examInfo(word);
  if (!info || !info.n) return '';
  const parts = [`出现 <b>${info.n}</b> 处`];
  if (info.papers.length) parts.push(`考过：${info.papers.map(escapeHtml).join('、')}`);
  return `<div class="section"><h3>原文用法</h3>
    <p class="hint">${parts.join(' · ')}</p>
    ${info.forms.length ? `<p class="hint">原文中出现的形式：${info.forms.map(f => '<b>' + escapeHtml(f) + '</b>').join('、')}</p>` : ''}
  </div>`;
}

/* ---------- 顽固词 ---------- */
const STUBBORN_BAD = 3;

function stubbornSet() {
  const srs = loadSrs();
  return new Set(Object.keys(srs).filter(w => {
    const r = srs[w];
    return r && (r.bad || 0) >= STUBBORN_BAD && (r.s || 0) <= 2;
  }));
}

/* ---------- 读文章 ---------- */
let currentPaper = -1;
let readCollectSet = new Set();
let wcWord = null;

function setupRead() {
  document.getElementById('wcClose').addEventListener('click', hideWordCard);
  document.addEventListener('click', (e) => {
    const card = document.getElementById('wordCard');
    if (!card.classList.contains('show')) return;
    if (card.contains(e.target) || (e.target.closest && e.target.closest('.read-body'))) return;
    hideWordCard();
  });
  document.getElementById('readCollect').addEventListener('click', () => {
    if (currentPaper < 0) return;
    let n = 0;
    readCollectSet.forEach(w => { if (nbAdd(w)) n++; });
    updateNbCount();
    renderReadBody();
    renderPaperList();
    showToast(n ? `已把 ${n} 个生词加入单词本` : '本篇生词都已在单词本里');
  });
  // 第一次进来时直接打开当前级别的第一篇，避免右边空着
  if (currentPaper < 0) {
    const first = papersOfLevel(currentLevel)[0];
    if (first) currentPaper = PAPERS.indexOf(first);
  }
  renderPaperList();
}

function papersOfLevel(level) {
  // 按级别取出文章，顺序保持最近的在前
  const out = [];
  for (let i = PAPERS.length - 1; i >= 0; i--) {
    if (PAPERS[i].v === level) out.push(PAPERS[i]);
  }
  return out;
}

function renderPaperList() {
  const box = document.getElementById('paperList');
  if (!box) return;
  // 只显示当前级别（四级或六级）的文章
  const list = PAPERS
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => p.v === currentLevel)
    .sort((a, b) => b.i - a.i);
  const levelName = currentLevel === 'cet6' ? '六级' : '四级';
  const summary = document.getElementById('readSummary');
  if (summary) summary.textContent = `${levelName}共 ${list.length} 篇`;
  if (!list.length) {
    box.innerHTML = '<li class="empty-tip">这个级别还没有文章</li>';
    return;
  }
  box.innerHTML = list.map(({ p, i }) => `
    <li data-paper="${i}" class="${i === currentPaper ? 'active' : ''}">
      <span class="word">${escapeHtml(p.l)}</span>
    </li>`).join('');
  box.querySelectorAll('li[data-paper]').forEach(li => {
    li.addEventListener('click', () => openPaper(Number(li.dataset.paper)));
  });
}

function paperSentences(idx) {
  const paper = PAPERS[idx];
  if (!paper) return [];
  return paper.p.map(para => para.map(id => SENTS[id]).filter(Boolean));
}

function openPaper(idx) {
  const paper = PAPERS[idx];
  if (!paper) return;
  // 点到别的级别的文章时，把级别按钮也跟着切过去，避免列表和正文对不上
  if (paper.v !== currentLevel) {
    currentLevel = paper.v;
    document.querySelectorAll('.sidebar button').forEach(b => {
      b.classList.toggle('active', b.dataset.level === currentLevel);
    });
  }
  currentPaper = idx;
  renderPaperList();
  renderReadBody();
}

function renderReadBody() {
  const paper = PAPERS[currentPaper];
  const body = document.getElementById('readBody');
  if (!paper || !body) return;
  // 列表已经按级别过滤，正文也必须对应当前级别，防止串台
  if (paper.v !== currentLevel) return;
  const nb = new Set(loadNotebook().map(r => r.w));
  const stubborn = stubbornSet();
  const lines = paperSentences(currentPaper);
  readCollectSet = new Set();

  const html = lines.map(para => {
    const text = para.map(s => s[2]).join(' ');
    return '<p>' + markWords(text, nb, stubborn) + '</p>';
  }).join('');
  body.innerHTML = html;

  // 统计本篇出现的四六级词
  const wordsInPaper = new Set();
  lines.forEach(para => para.forEach(s => {
    const toks = new Set(s[2].toLowerCase().match(/[a-z]+/g) || []);
    toks.forEach(t => { if (WORD_MAP.has(t) && !SKIP_LIGHT.has(t)) wordsInPaper.add(WORD_MAP.get(t).w); });
  }));
  const fresh = [...wordsInPaper].filter(w => !nb.has(w));
  readCollectSet = new Set(fresh);

  document.getElementById('readTitle').textContent = paper.l;
  document.getElementById('readSub').textContent =
    `本篇共 ${wordsInPaper.size} 个四六级词，其中 ${fresh.length} 个还不在单词本里`;
  document.getElementById('readCollect').style.display = fresh.length ? '' : 'none';

  body.querySelectorAll('.hl').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      showWordCard(el.dataset.w, el);
    });
  });
}

function markWords(text, nb, stubborn) {
  const escaped = escapeHtml(text);
  return escaped.replace(/([A-Za-z]+(?:['’-][A-Za-z]+)?)/g, (m) => {
    const key = m.toLowerCase();
    if (!WORD_MAP.has(key) || SKIP_LIGHT.has(key)) return m;
    const cls = nb.has(WORD_MAP.get(key).w) ? 'hl unknown' : 'hl';
    return `<span class="${cls}" data-w="${escapeHtml(WORD_MAP.get(key).w)}">${m}</span>`;
  });
}

function showWordCard(word, anchor) {
  const info = WORD_MAP.get(String(word).toLowerCase());
  if (!info) return;
  wcWord = info;
  const card = document.getElementById('wordCard');
  document.getElementById('wcWord').innerHTML =
    (info.level === 'cet6' ? '<span class="level-tag cet6" style="font-size:11px;padding:1px 6px;">六级</span>' : '<span class="level-tag" style="font-size:11px;padding:1px 6px;">四级</span>') +
    escapeHtml(info.w);
  document.getElementById('wcPhonetic').textContent = info.p ? '/' + info.p + '/' : '';
  document.getElementById('wcMeaning').textContent = (info.pos ? info.pos + ' ' : '') + (info.m || '');
  const ex = examInfo(word);
  document.getElementById('wcExam').textContent = ex && ex.n ? `原文出现 ${ex.n} 处` : '';
  const inNb = nbHas(info.w);
  const toggle = document.getElementById('wcToggle');
  toggle.textContent = inNb ? '移出单词本' : '加入单词本';
  toggle.classList.toggle('remove', inNb);
  toggle.onclick = () => {
    if (nbHas(info.w)) nbRemove(info.w); else nbAdd(info.w);
    updateNbCount();
    renderReadBody();
    showWordCard(word, anchor);
  };

  card.classList.add('show');
  const rect = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: 200, top: 200, bottom: 220 };
  const left = Math.min(Math.max(12, rect.left - 20), window.innerWidth - 300);
  const top = rect.bottom + 8 + 260 > window.innerHeight ? Math.max(12, rect.top - 270) : rect.bottom + 8;
  card.style.left = left + 'px';
  card.style.top = top + 'px';
}

function hideWordCard() {
  document.getElementById('wordCard').classList.remove('show');
  wcWord = null;
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:80;transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

/* ---------- 模式 ---------- */
function setupModeTabs() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMode(btn.dataset.mode));
  });
}

function switchMode(m) {
  if (m !== 'study') clearAdvance();
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  document.getElementById('listPanel').style.display = (m === 'lookup') ? 'flex' : 'none';
  document.getElementById('notebookPanel').style.display = (m === 'notebook') ? 'flex' : 'none';

    if (currentPaper < 0 || !PAPERS[currentPaper] || PAPERS[currentPaper].v !== currentLevel) {
      const first = papersOfLevel(currentLevel)[0];
      currentPaper = first ? PAPERS.indexOf(first) : -1;

/* ---------- 背词 ---------- */
function renderStudyStatus() {
  const box = document.getElementById('studyStatus');
  if (!box) return;
  const label = currentLevel === 'cet6' ? '六级' : '四级';
  const cls = currentLevel === 'cet6' ? 'study-level cet6' : 'study-level';
  const due = dueWords(currentLevel).length;
  const today = todayStats();
  const rate = today.n ? Math.round(today.ok / today.n * 100) : 0;
  const streak = streakDays();
  box.innerHTML = `<span class="${cls}">${label}</span>` +
    `<span>待复习 <b>${due}</b></span>` +
    `<span>已掌握 <b>${srsMasteredCount(currentLevel)}</b></span>` +
    `<span>今日 <b>${today.n}</b> 个 · 正确 <b>${rate}%</b> · 连续 <b>${streak}</b> 天</span>`;
}

function startStudy() {
  clearAdvance();
  document.getElementById('btnUnknown').style.display = '';
  document.getElementById('btnKnown').style.display = '';
  document.getElementById('btnAgain').style.display = 'none';
  document.getElementById('card').style.display = 'block';
  document.getElementById('card').classList.remove('flipped', 'answer-known', 'answer-miss', 'card-enter');
  renderStudyStatus();

  // 0) 反复答错的顽固词优先
  const stubborn = stubbornSet();
  const stubWords = loadNotebook()
    .filter(r => r.level === currentLevel && stubborn.has(r.w))
    .sort((a, b) => (srsOf(b.w).bad || 0) - (srsOf(a.w).bad || 0))
    .map(r => r.w);
  // 1) 今天到期该复习的（按到期时间早晚）
  const due = stubWords.slice(0, 10);
  dueWords(currentLevel).forEach(w => { if (!due.includes(w) && due.length < 20) due.push(w); });
  // 2) 单词本里还没排进计划的
  const inQueue = new Set(due);
  const nbWords = loadNotebook().filter(r => r.level === currentLevel && WORD_MAP.has(String(r.w).toLowerCase())).map(r => r.w);
  nbWords.forEach(w => { if (!inQueue.has(w)) { inQueue.add(w); due.push(w); } });
  // 3) 从没背过的新词补齐到 20 个
  const srs = loadSrs();
  const fresh = words
    .filter(w => !inQueue.has(w.w) && !srs[w.w])
    .sort(() => Math.random() - 0.5);
  while (due.length < 20 && fresh.length) due.push(fresh.pop().w);

  studyQueue = due;
  studyIndex = 0;
  if (studyQueue.length === 0) {
    document.getElementById('studyProgress').textContent = '今天没有要复习的词';
    document.getElementById('cardWord').textContent = '复习完成';
    document.getElementById('cardPhonetic').textContent = '';
    document.getElementById('cardWordBack').textContent = '';
    document.getElementById('cardPos').textContent = '';
    document.getElementById('cardMeaning').textContent = '到期的词都背完了，明天再来';
    document.getElementById('cardExample').textContent = '';
    document.getElementById('cardSrc').textContent = '';
    document.getElementById('btnUnknown').style.display = 'none';
    document.getElementById('btnKnown').style.display = 'none';
    return;
  }
  renderStudyCard();
}

function currentStudyWord() {
  return words.find(w => w.w === studyQueue[studyIndex]);
}

function renderStudyCard() {
  const w = currentStudyWord();
  if (!w) { advanceNext(); return; }
  const card = document.getElementById('card');
  card.classList.remove('flipped', 'answer-known', 'answer-miss', 'card-enter');
  document.getElementById('cardWord').textContent = w.w;
  document.getElementById('cardPhonetic').textContent = w.p ? '/' + w.p + '/' : '';
  document.getElementById('cardWordBack').textContent = w.w;
  document.getElementById('cardPos').textContent = w.pos || '';
  document.getElementById('cardMeaning').textContent = w.m || '';
  const hits = sentencesFor(w.w);
  document.getElementById('cardExample').textContent = hits.hits.length ? hits.hits[0][2] : '';
  document.getElementById('cardSrc').textContent = hits.hits.length ? hits.hits[0][0] : '';
  document.getElementById('studyProgress').textContent = (studyIndex + 1) + ' / ' + studyQueue.length;
  document.getElementById('btnPrev').disabled = studyIndex === 0;
  // 重新触发入场动画
  void card.offsetWidth;
  card.classList.add('card-enter');
}

function clearAdvance() {
  pendingTimers.forEach(t => clearTimeout(t));
  pendingTimers = [];
  advanceTimer = null;
}

function later(fn, ms) {
  const t = setTimeout(fn, ms);
  pendingTimers.push(t);
  advanceTimer = t;
  return t;
}

function flashButton(id, cls) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.classList.remove('flash-ok', 'flash-bad');
  void btn.offsetWidth;
  btn.classList.add(cls);
  setTimeout(() => btn.classList.remove(cls), 600);
}

function advanceNext() {
  studyIndex++;
  if (studyIndex >= studyQueue.length) {
    document.getElementById('studyProgress').textContent = '本轮完成';
    document.getElementById('card').classList.remove('flipped', 'answer-known', 'answer-miss', 'card-enter');
    document.getElementById('cardWord').textContent = '本轮完成';
    document.getElementById('cardPhonetic').textContent = '';
    document.getElementById('cardWordBack').textContent = '';
    document.getElementById('cardPos').textContent = '';
    document.getElementById('cardMeaning').textContent = '共背了 ' + studyQueue.length + ' 个词';
    document.getElementById('cardExample').textContent = '';
    document.getElementById('cardSrc').textContent = '';
    document.getElementById('btnUnknown').style.display = 'none';
    document.getElementById('btnKnown').style.display = 'none';
    document.getElementById('btnPrev').disabled = true;
    document.getElementById('btnAgain').style.display = '';
  } else {
    renderStudyCard();
  }
}

function gradeCard(known) {
  if (advanceTimer) return;
  const w = currentStudyWord();
  if (!w) return;
  // 记录复习进度：认识则拉长下次间隔，不认识则从头再来
  srsGrade(w.w, known);
  recordAnswer(known);
  if (known) {
    nbRemove(w.w);
  } else {
    nbAdd(w.w);
  }
  updateNbCount();
  renderStudyStatus();
  const card = document.getElementById('card');
  card.classList.remove('answer-known', 'answer-miss', 'card-enter');
  void card.offsetWidth;
  if (known) {
    // 认识：往上轻轻一提，绿框 + 对勾，翻出释义后停留一会儿
    card.classList.add('answer-known');
    flashButton('btnKnown', 'flash-ok');
    later(() => card.classList.add('flipped'), 120);
    later(() => { advanceTimer = null; advanceNext(); }, KNOWN_HOLD_MS);
  } else {
    // 不认识：抖一下，红框 + 叉号，翻出释义后多停留一会儿再看下一张
    card.classList.add('answer-miss');
    flashButton('btnUnknown', 'flash-bad');
    later(() => card.classList.add('flipped'), 380);
    later(() => { advanceTimer = null; advanceNext(); }, MISS_HOLD_MS);
  }
}

function goPrev() {
  clearAdvance();
  if (studyIndex <= 0) return;
  studyIndex--;
  document.getElementById('card').style.display = 'block';
  document.getElementById('btnUnknown').style.display = '';
  document.getElementById('btnKnown').style.display = '';
  document.getElementById('btnAgain').style.display = 'none';
  renderStudyCard();
}

function setupStudy() {
  document.getElementById('card').addEventListener('click', () => {
    document.getElementById('card').classList.toggle('flipped');
  });
  document.getElementById('btnKnown').addEventListener('click', () => gradeCard(true));
  document.getElementById('btnUnknown').addEventListener('click', () => gradeCard(false));
  document.getElementById('btnPrev').addEventListener('click', goPrev);
  document.getElementById('btnAgain').addEventListener('click', startStudy);
  document.getElementById('btnExit').addEventListener('click', () => switchMode('lookup'));
}

/* 背词键盘快捷键：空格翻面，J 认识，K 不认识，退格/左箭头回上一个 */
function setupStudyKeys() {
  document.addEventListener('keydown', (e) => {
    if (mode !== 'study') return;
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === ' ' || key === 'enter') {
      e.preventDefault();
      document.getElementById('card').classList.toggle('flipped');
    } else if (key === 'j') {
      e.preventDefault();
      gradeCard(true);
    } else if (key === 'k') {
      e.preventDefault();
      gradeCard(false);
    } else if (key === 'backspace' || key === 'arrowleft') {
      e.preventDefault();
      goPrev();
    } else if (key === 'escape') {
      switchMode('lookup');
    }
  });
}

/* ---------- 备份与恢复 ---------- */
function backupPayload() {
  return {
    app: 'english-workbench',
    version: 2,
    exportedAt: new Date().toISOString(),
    notebook: loadNotebook(),
    srs: loadSrs(),
    stats: loadStats(),
  };
}

function exportData() {
  const data = JSON.stringify(backupPayload(), null, 0);
  const blob = new Blob([data], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  a.href = url;
  a.download = `单词本备份-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function importData(text) {
  const data = JSON.parse(text);
  if (!data || typeof data !== 'object' || !(data.notebook || data.srs || data.stats)) {
    throw new Error('格式不符');
  }
  // 单词本合并去重
  const rows = loadNotebook();
  const seen = new Set(rows.map(r => r.w));
  (Array.isArray(data.notebook) ? data.notebook : []).forEach(r => {
    if (r && r.w && !seen.has(r.w)) {
      seen.add(r.w);
      rows.push({ w: r.w, level: r.level || ((WORD_MAP.get(String(r.w).toLowerCase()) || {}).level) || 'cet4', t: r.t || Date.now() });
    }
  });
  saveNotebook(rows);

  // 复习记录：同一词取较新的那条
  const srs = loadSrs();
  Object.entries(data.srs || {}).forEach(([w, rec]) => {
    if (!rec || typeof rec !== 'object') return;
    const old = srs[w];
    if (!old || (rec.l || 0) > (old.l || 0)) srs[w] = rec;
  });
  saveSrs(srs);

  // 打卡统计：按天合并取较大值
  const stats = loadStats();
  Object.entries(data.stats || {}).forEach(([day, rec]) => {
    if (!rec || typeof rec !== 'object') return;
    const old = stats[day] || { n: 0, ok: 0 };
    stats[day] = { n: Math.max(old.n || 0, rec.n || 0), ok: Math.max(old.ok || 0, rec.ok || 0) };
  });
  saveStats(stats);

  updateNbCount();
  renderNotebook();
  renderStudyStatus();
  if (mode === 'study') startStudy();
  alert('导入完成：单词本 ' + loadNotebook().length + ' 个词，复习记录 ' + Object.keys(loadSrs()).length + ' 条。');
}

function renderNotebook() {
  const box = document.getElementById('nbList');
  if (!box) return;
  const all = loadNotebook();
  const stubborn = stubbornSet();
  const rows = nbFilter === 'stubborn'
    ? all.filter(r => stubborn.has(r.w))
    : (nbFilter === 'all' ? all : all.filter(r => r.level === nbFilter));
  const stubbornCount = all.filter(r => stubborn.has(r.w)).length;
  document.getElementById('nbSummary').textContent = `共 ${all.length} 个生词 · 顽固 ${stubbornCount}`;
  updateNbCount();
  if (!rows.length) {
    box.innerHTML = '<li style="padding:20px;text-align:center;color:#888;cursor:default;">还没有生词。背词时点“不认识”，或在单词详情里点“加入单词本”。</li>';
    return;
  }
  box.innerHTML = rows.map(r => {
    const w = WORD_MAP.get(String(r.w).toLowerCase()) || { w: r.w, m: '', pos: '', level: r.level };
    const isCet6 = r.level === 'cet6';
    return `<li data-word="${escapeHtml(r.w)}" class="${currentDetail && currentDetail.w === r.w ? 'active' : ''}">
      <span class="word">${escapeHtml(r.w)}</span>
      <span class="level ${isCet6 ? 'cet6' : ''}">${isCet6 ? '六级' : '四级'}</span>
      <span class="pos">${escapeHtml(w.pos || '')}</span>
      ${(srsOf(r.w) && srsOf(r.w).bad) ? `<span class="bad-badge">错${srsOf(r.w).bad}</span>` : ''}
      <span class="meaning">${escapeHtml((w.m || '').slice(0, 20))}</span>
    </li>`;
  }).join('');
  box.querySelectorAll('li[data-word]').forEach(li => {
    li.addEventListener('click', () => {
      const w = WORD_MAP.get(li.dataset.word.toLowerCase());
      if (w) showDetail(w);
    });
  });
}

/* ---------- 详情 ---------- */
function showDetail(word) {
  currentDetail = word;
  const phonetic = word.p ? `<span class="phonetic">/${escapeHtml(word.p)}/</span>` : '';
  const pos = word.pos ? `<span class="pos-badge">${escapeHtml(word.pos)}</span>` : '';
  const meaning = escapeHtml(word.m || '');
  const tag = word.level === 'cet6' ? '<span class="level-tag cet6">六级</span>' : '<span class="level-tag">四级</span>';

  const hitInfo = sentencesFor(word.w);
  const hits = hitInfo.hits;
  const root = hitInfo.root;
  let examplesHtml = '';
  if (hits.length) {
    let note = '';
    if (root) {
      note = `<p class="hint" style="margin-bottom:10px;">该词在已收录原文中未直接出现，下面是词根 <b>${escapeHtml(root)}</b> 的例句。</p>`;
    } else if (hitInfo.cross) {
      note = `<p class="hint" style="margin-bottom:10px;">该词未出现在本级原文中，以下例句来自另一级的原文。</p>`;
    }
    examplesHtml = `
      <div class="section">
        <h3>原文出处 (${hits.length})</h3>
        ${note}
        <ul class="examples">
          ${hits.slice(0, 10).map(ex => `
            <li>
              <div class="source">${escapeHtml(ex[0])}${ex[1] ? ' · ' + escapeHtml(ex[1]) : ''}</div>
              <div class="text">${highlightText(ex[2], root || word.w)}</div>
            </li>
          `).join('')}
        </ul>
      </div>`;
  } else {
    examplesHtml = `<div class="section"><h3>原文出处</h3><p class="hint">已收录 ${PAPER_COUNT} 篇原创短文，该单词暂未出现在其中；完整词库请按 README 自行准备。</p></div>`;
  }

  const inNb = nbHas(word.w);
  detailPanel.innerHTML = `
    <div class="head-row">
      <div class="headword">${tag}${escapeHtml(word.w)}</div>
      <button class="nb-toggle ${inNb ? 'remove' : ''}" id="nbToggle">${inNb ? '移出单词本' : '加入单词本'}</button>
    </div>
    <div class="phonetic">${phonetic}</div>
    <div class="meaning">${pos} ${meaning}</div>
    ${examBlock(word.w)}
    ${examplesHtml}
    <div class="section">
      <h3>近义词</h3>
      <div class="synonyms" id="synonyms">加载中...</div>
    </div>
  `;
  document.getElementById('nbToggle').addEventListener('click', () => {
    if (nbHas(word.w)) nbRemove(word.w); else nbAdd(word.w);
    updateNbCount();
    if (mode === 'notebook') renderNotebook();
    showDetail(word);
  });
  if (mode === 'notebook') renderNotebook();
  loadSynonyms(word.w);
}

async function loadSynonyms(word) {
  const container = document.getElementById('synonyms');
  if (!container) return;
  try {
    const resp = await fetch('https://api.datamuse.com/words?rel_syn=' + encodeURIComponent(word) + '&max=8');
    const data = await resp.json();
    container.innerHTML = data.length
      ? data.map(s => `<button class="synonym-btn" onclick="searchFor('${escapeHtml(s.word)}')">${escapeHtml(s.word)}</button>`).join('')
      : '<span class="hint">暂无数据</span>';
  } catch (e) {
    container.innerHTML = '<span class="hint">暂无数据（需联网）</span>';
  }
}

function searchFor(word) {
  if (mode !== 'lookup') switchMode('lookup');
  searchInput.value = word;
  searchInput.dispatchEvent(new Event('input'));
}

/* ---------- 查词 ---------- */
function init() {
  setupBackHome();
  try { migrateLegacyKeys(); } catch (e) {}
  migrateOldProgress();
  updateWords();
  setupButtons();
  setupSearch();
  setupModeTabs();
  setupStudy();
  setupStudyKeys();
  setupNotebook();
  setupRead();
  showQuote();
  updateNbCount();
  warnIfStorageBlocked();
}

function updateStoreLabel() {
  const el = document.getElementById('storeLabel');
  if (!el) return;
  const native = Store.name !== 'browser';
  el.textContent = native ? '进度保存在本机应用内' : '进度保存在当前浏览器';
  el.title = '换浏览器或清理浏览器数据会丢失，记得定期导出备份';
}

/* 单独打开这个页面（不在工作台里）时，隐藏返回工作台的入口。
 * 判断依据是路径里有没有 modules，而不是存储层是否加载成功，
 * 否则一旦存储文件没引入，按钮就会被误藏起来。 */
function setupBackHome() {
  const back = document.getElementById('backHome');
  if (!back) return;
  const dir = (typeof location !== 'undefined' && location.pathname) ? location.pathname : '';
  const inWorkbench = /modules[\\/]/.test(dir);
  back.style.display = inWorkbench ? '' : 'none';
}

/* 浏览器禁用本地存储时，进度存不下来，必须让用户知道 */
function warnIfStorageBlocked() {
  let ok = true;
  try {
    const probe = '__wb_probe__';
    Store.set(probe, '1');
    ok = Store.get(probe) === '1';
    Store.remove(probe);
  } catch (e) { ok = false; }
  if (!ok) {
    showToast('浏览器已禁用本地存储，背词进度无法保存，请换普通窗口打开');
    return;
  }
  updateStoreLabel();
}

function updateWords() {
  words = currentLevel === 'cet4' ? CET4_WORDS : CET6_WORDS;
  filtered = [];
  wordList.innerHTML = '';
  showDailyRecommendation();
}

function setupButtons() {
  document.querySelectorAll('.sidebar button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const prevLevel = currentLevel;
      currentLevel = btn.dataset.level;
      searchInput.value = '';
      updateWords();
      detailPanel.innerHTML = '<p class="empty">从左侧选一个单词，或直接输入查词。</p>';
      currentDetail = null;
      if (mode === 'study') startStudy();
      // 读文章也要跟着切级别：换了级别就重排列表，并自动打开该级别的最新一篇
      if (mode === 'read' && prevLevel !== currentLevel) {
        const first = papersOfLevel(currentLevel)[0];
        currentPaper = first ? PAPERS.indexOf(first) : -1;
        renderPaperList();
        renderReadBody();
      }
    });
  });
}

function setupSearch() {
  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.trim().toLowerCase();
    selectedIndex = -1;
    if (!query) {
      filtered = [];
      wordList.innerHTML = '';
      return;
    }
    filtered = ALL_WORDS.filter(w => w.w.toLowerCase().startsWith(query));
    renderList();
  });
}

function showDailyRecommendation() {
  const dailySection = document.getElementById('dailySection');
  const dailyList = document.getElementById('dailyList');
  if (!dailySection || !dailyList) return;

  const n = 5 + Math.floor(Math.random() * 2);
  const hot = words.filter(w => (w.freq || 0) > 0).sort((a, b) => b.freq - a.freq).slice(0, 200);
  const pool = hot.length >= n ? hot : words;
  const daily = [...pool].sort(() => Math.random() - 0.5).slice(0, n);

  dailyList.innerHTML = daily.map(w => `
    <li data-word="${escapeHtml(w.w)}">
      <span class="word">${escapeHtml(w.w)}</span>
      <span class="pos">${escapeHtml(w.pos || '')}</span>
      <span class="meaning">${escapeHtml((w.m || '').slice(0, 25))}</span>
    </li>
  `).join('');

  dailyList.querySelectorAll('li').forEach(li => {
    li.addEventListener('click', () => {
      const word = words.find(w => w.w === li.dataset.word);
      if (word) showDetail(word);
    });
  });
}

function showQuote() {
  const quoteText = document.getElementById('quoteText');
  const quoteZh = document.getElementById('quoteZh');
  if (!quoteText) return;
  const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
  quoteText.textContent = '"' + q.en + '"';
  quoteZh.textContent = q.zh;
}

function renderList() {
  if (filtered.length === 0) {
    wordList.innerHTML = '<li style="padding:20px;text-align:center;color:#888;cursor:default;">无匹配单词</li>';
    return;
  }
  const display = filtered.slice(0, 50);
  wordList.innerHTML = display.map((w, i) => {
    const isActive = i === selectedIndex ? ' active' : '';
    return `<li class="${isActive}" data-index="${i}">
      <span class="word">${escapeHtml(w.w)}</span>
      <span class="level ${w.level === 'cet6' ? 'cet6' : ''}">${w.level === 'cet6' ? '六级' : '四级'}</span>
      <span class="pos">${escapeHtml(w.pos || '')}</span>
    </li>`;
  }).join('');

  wordList.querySelectorAll('li[data-index]').forEach((li, i) => {
    li.addEventListener('click', () => {
      selectedIndex = i;
      renderList();
      showDetail(filtered[i]);
    });
  });
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escapeRegex(str) {
  return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlightText(text, word) {
  const escaped = escapeHtml(text);
  const forms = formsFor(word).map(escapeRegex).join('|');
  const rx = new RegExp('(' + forms + ')(?![A-Za-z])', 'gi');
  return escaped.replace(rx, '<mark>$1</mark>');
}

init();
